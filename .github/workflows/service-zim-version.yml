name: Update and sync service-zim version

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  service-zim-version:
    runs-on: ubuntu-26.04
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow must be dispatched from main." >&2
          exit 1

      - name: Check out this repository
        uses: actions/checkout@v7.0.1

      - name: Increment service-zim version
        shell: bash
        run: |
          version="$(< service-zim-version)"
          if [[ ! "$version" =~ ^[0-9]+$ ]]; then
            echo "Expected service-zim-version to contain a number." >&2
            exit 1
          fi
          printf '%s\n' "$((version + 1))" > service-zim-version

      - name: Stage service-zim version
        run: git add service-zim-version

      - name: Commit staged changes using REST
        uses: thms-rmb/test-ci-signed-commits/.github/actions/commit-staged-using-rest@58b80e09e8afaf729a7417e367f79dcc0d8ebdfb
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          message: "chore: update service-zim version"

      - name: Get Octo STS token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: thms-rmb/test-ci-signed-commits
          identity: update-service-zim

      - name: Check out test-ci-signed-commits
        uses: actions/checkout@v7.0.1
        with:
          repository: thms-rmb/test-ci-signed-commits
          ref: main
          path: target
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: false

      - name: Copy caller version to dev
        run: cp service-zim-version target/dev/service-zim-version

      - name: Stage dev version
        run: git -C target add dev/service-zim-version

      - name: Commit staged changes using REST
        uses: thms-rmb/test-ci-signed-commits/.github/actions/commit-staged-using-rest@58b80e09e8afaf729a7417e367f79dcc0d8ebdfb
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          repository: thms-rmb/test-ci-signed-commits
          ref: refs/heads/main
          working-directory: target
          message: "chore: sync service-zim version from caller repo"
