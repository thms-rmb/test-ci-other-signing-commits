name: Update service-zim version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7.0.1

      - name: Increment service-zim version
        shell: bash
        run: |
          version="$(< service-zim-version)"
          if [[ ! "$version" =~ ^[0-9]+$ ]]; then
            echo "Expected service-zim-version to contain a number." >&2
            exit 1
          fi
          printf '%s\n' "$((version + 1))" > service-zim-version

      - name: Stage service-zim version
        run: git add service-zim-version

      - name: Commit staged changes using REST
        uses: thms-rmb/test-ci-signed-commits/.github/actions/commit-staged-using-rest@3efef5a28f9534c0c84b522dba98429264d2c1ae
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          message: "chore: update service-zim version"
